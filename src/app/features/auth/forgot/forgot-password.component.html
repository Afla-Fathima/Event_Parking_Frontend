@if (message()) {
  <div class="message success">
    {{ message() }}
  </div>
}

@if (error()) {
  <div class="message error">
    {{ error() }}
  </div>
}

@if (token()) {

  <div class="token-card">

    <div>

      <span>
        Development reset token
      </span>

      <code>
        {{ token() }}
      </code>

    </div>

    <button
      type="button"
      class="btn btn-primary"
      (click)="continueToReset()"
    >
      Continue securely →
    </button>

  </div>

}
