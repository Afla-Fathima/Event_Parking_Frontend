<button
  type="button"
  class="seat"
  [ngClass]="{ selected: selected, occupied: !available() }"
  [disabled]="!available()"
  [appSeatStatus]="seat.status"
  (click)="click()"
  [attr.aria-label]="'Seat ' + seat.seatNumber + ', ' + (selected ? 'selected' : seat.status)"
>
  <span class="seat-back">
    <strong>{{ seat.seatNumber | seatLabel }}</strong>
  </span>
  <small>{{ selected ? 'Selected' : seat.status }}</small>
</button>
